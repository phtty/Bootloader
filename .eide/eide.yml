version: "4.1"
name: Bootloader
type: ARM
deviceName: STM32H750VBTx
packDir: null
srcDirs:
  - Core
  - Platform
  - Kernel
  - Device
  - Application
virtualFolder:
  name: <virtual_root>
  files: []
  folders:
    - name: Drivers
      files: []
      folders:
        - name: HAL_Driver
          files:
            - path: Drivers/STM32H7xx_HAL_Driver/Src/stm32h7xx_hal.c
            - path: Drivers/STM32H7xx_HAL_Driver/Src/stm32h7xx_hal_cortex.c
            - path: Drivers/STM32H7xx_HAL_Driver/Src/stm32h7xx_hal_rcc.c
            - path: Drivers/STM32H7xx_HAL_Driver/Src/stm32h7xx_hal_rcc_ex.c
            - path: Drivers/STM32H7xx_HAL_Driver/Src/stm32h7xx_hal_flash.c
            - path: Drivers/STM32H7xx_HAL_Driver/Src/stm32h7xx_hal_flash_ex.c
            - path: Drivers/STM32H7xx_HAL_Driver/Src/stm32h7xx_hal_gpio.c
            - path: Drivers/STM32H7xx_HAL_Driver/Src/stm32h7xx_hal_hsem.c
            - path: Drivers/STM32H7xx_HAL_Driver/Src/stm32h7xx_hal_dma.c
            - path: Drivers/STM32H7xx_HAL_Driver/Src/stm32h7xx_hal_dma_ex.c
            - path: Drivers/STM32H7xx_HAL_Driver/Src/stm32h7xx_hal_mdma.c
            - path: Drivers/STM32H7xx_HAL_Driver/Src/stm32h7xx_hal_pwr.c
            - path: Drivers/STM32H7xx_HAL_Driver/Src/stm32h7xx_hal_pwr_ex.c
            - path: Drivers/STM32H7xx_HAL_Driver/Src/stm32h7xx_hal_i2c.c
            - path: Drivers/STM32H7xx_HAL_Driver/Src/stm32h7xx_hal_i2c_ex.c
            - path: Drivers/STM32H7xx_HAL_Driver/Src/stm32h7xx_hal_exti.c
            - path: Drivers/STM32H7xx_HAL_Driver/Src/stm32h7xx_hal_qspi.c
            - path: Drivers/STM32H7xx_HAL_Driver/Src/stm32h7xx_ll_delayblock.c
            - path: Drivers/STM32H7xx_HAL_Driver/Src/stm32h7xx_hal_uart.c
            - path: Drivers/STM32H7xx_HAL_Driver/Src/stm32h7xx_hal_uart_ex.c
          folders: []
dependenceList: []
outDir: build
miscInfo:
  uid: 46e07b959d7f74a6b229255d87b9507b
targets:
  Debug:
    cppPreprocessAttrs:
      defineList:
        - USE_PWR_LDO_SUPPLY
        - USE_HAL_DRIVER
        - STM32H750xx
      incList:
        - Core/Inc
        - Platform/Inc
        - Kernel/Inc
        - Device/Inc
        - Application/Inc
        - Drivers/CMSIS/Device/ST/STM32H7xx/Include
        - Drivers/CMSIS/Include
        - Drivers/STM32H7xx_HAL_Driver/Inc
        - Drivers/STM32H7xx_HAL_Driver/Inc/Legacy
      libList: []
    excludeList:
      - <virtual_root>/Core/Src/gpio.c
      - <virtual_root>/Core/Src/dma.c
      - <virtual_root>/Core/Src/quadspi.c
      - <virtual_root>/Core/Src/usart.c
      - <virtual_root>/Core/Src/memorymap.c
    settings:
      debugger: cortex-debug
    toolchain: GCC
    toolchainConfigMap:
      GCC:
        archExtensions: ""
        cpuType: Cortex-M7
        floatingPointHardware: double
        options:
          version: 5
          afterBuildTasks: []
          asm-compiler:
            ASM_FLAGS: ""
          beforeBuildTasks: []
          c/cpp-compiler:
            CXX_FLAGS: ""
            C_FLAGS: ""
            language-c: c11
            language-cpp: c++11
            one-elf-section-per-data: true
            one-elf-section-per-function: true
            optimization: level-debug
            warnings: all-warnings
          global:
            $float-abi-type: hard
            misc-control: --specs=nosys.specs --specs=nano.specs
            output-debug-info: enable
          linker:
            LD_FLAGS: ""
            LIB_FLAGS: -lm -lc -lnosys
            output-format: elf
            remove-unused-input-sections: true
        scatterFilePath: STM32H750XX_FLASH.ld
        storageLayout:
          RAM: []
          ROM: []
        useCustomScatterFile: true
    uploadConfigMap:
      JLink:
        baseAddr: ""
        bin: ""
        cpuInfo:
          cpuName: "null"
          vendor: "null"
        otherCmds: ""
        proType: 1
        speed: 8000
      OpenOCD:
        baseAddr: "0x08000000"
        bin: ""
        interface: cmsis-dap
        target: stm32h7x
    uploader: OpenOCD
